<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8ee">
    <title>Pawpaw is waiting for the internet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; padding: clamp(1rem, 5vw, 4rem); background: radial-gradient(circle at 15% 18%, rgba(232,82,106,.11) 0 9rem, transparent 9.1rem), radial-gradient(circle at 90% 88%, rgba(155,95,192,.11) 0 13rem, transparent 13.1rem), #fff8ee; color: #2a1f14; font: 500 1rem/1.65 Manrope, ui-sans-serif, system-ui, sans-serif; }
      main { position: relative; width: min(100%, 38rem); padding: clamp(1.5rem, 6vw, 3.5rem); border: 1px solid #e0d5c4; border-radius: 2rem; background: rgba(255,253,247,.94); box-shadow: 0 1.5rem 4rem rgba(65,42,25,.11); }
      .brand { margin: 0 0 2rem; font: 500 1.7rem/1 Georgia, serif; letter-spacing: -.03em; }
      .heart, .star { color: #e8526a; }
      .eyebrow { margin: 0 0 .55rem; color: #8b1a2f; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { max-width: 12ch; margin: 0; font: 500 clamp(2.5rem, 10vw, 4.7rem)/.96 Georgia, serif; letter-spacing: -.045em; }
      .message { max-width: 31rem; margin: 1.1rem 0 0; color: #5c4e3d; }
      button { min-height: 3rem; margin-top: 1.5rem; padding: .7rem 1rem; border: 0; border-radius: .8rem; background: #8b1a2f; color: #fffdf7; font: 750 .9rem/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 .7rem 1.5rem rgba(139,26,47,.16); }
      button:hover { transform: translateY(-2px); }
      .note { margin: .9rem 0 0; color: #8c7e6d; font-size: .75rem; }
      .stars { position: absolute; right: 2rem; top: 2rem; color: #9b5fc0; letter-spacing: .65rem; transform: rotate(8deg); }
      @media (prefers-reduced-motion: reduce) { button:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">pawpaw <span class="heart" aria-hidden="true">♥</span></p>
      <p class="stars" aria-hidden="true">✦ · ✦</p>
      <p class="eyebrow">A small pause</p>
      <h1>The internet wandered off.</h1>
      <p class="message">Pawpaw keeps family pages and photographs off the device when you’re offline. Reconnect, then we’ll carry on exactly where you were.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="note">Nothing was changed while the connection was away.</p>
    </main>
  </body>
</html>
