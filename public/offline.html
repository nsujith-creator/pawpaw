<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f9f">
    <title>No connection · pawpaw</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; background: #2f6f9f; color: #fff; font: 500 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 40px 16px 56px; max-width: 44rem; }
      .word { position: absolute; top: 20px; left: 16px; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.03em; }
      h1 { font-weight: 800; font-size: clamp(2.6rem, 12vw, 4.6rem); line-height: 0.95; letter-spacing: -0.045em; max-width: 12ch; }
      p { font-family: Georgia, "Times New Roman", serif; font-size: 1.15rem; max-width: 30rem; }
      button { align-self: flex-start; min-height: 48px; margin-top: 8px; padding: 0 1.3rem; border: 0; border-radius: 999px; background: #22163a; color: #fff; font: 700 1rem/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
      button:focus-visible { outline: 3px solid #ffc93c; outline-offset: 3px; }
      @media (min-width: 900px) { main { padding: 80px 56px; } .word { left: 56px; top: 40px; } }
    </style>
  </head>
  <body>
    <span class="word">pawpaw</span>
    <main>
      <h1>No connection.</h1>
      <p>Her pages and photos aren't kept on this phone, so they need the internet. Connect, then try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
